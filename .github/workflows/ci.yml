name: FinnRacing CI

on:
  push:
    branches: [main, feature/finntrack-game-lobby]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and validate Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run game tests
        run: npm test

      - name: Check JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/physics.js
          node --check src/raceRoom.js
          node --check public/client.js
          node --check public/physics-client.js

      - name: Check patch whitespace
        working-directory: .
        run: git diff --check HEAD^

      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
